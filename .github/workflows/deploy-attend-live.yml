name: Deploy attend-live console

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "face-attendance-ui/**"
      - "deploy/attend-live/**"
      - ".github/workflows/deploy-attend-live.yml"

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: face-attendance-ui/package-lock.json

      - name: Build console
        working-directory: face-attendance-ui
        env:
          VITE_API_BASE: https://faceattend-api.blueground-3385828b.eastasia.azurecontainerapps.io
        run: |
          npm ci
          npm run build

      - name: Assemble deploy package
        run: |
          mkdir -p package
          cp -r face-attendance-ui/dist package/dist
          cp deploy/attend-live/server.js package/server.js
          cp deploy/attend-live/package.json package/package.json
          ls -la package package/dist | head -30

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to attend-live
        uses: azure/webapps-deploy@v3
        with:
          app-name: attend-live
          package: package
